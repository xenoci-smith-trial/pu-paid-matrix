name: Matrix CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        config: [debug, release]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: if [ "${{ matrix.config }}" = test ]; then swift test; else swift build -c ${{ matrix.config }}; fi
